<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eb4b2b" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <g filter="url(#drop)" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Badminton Racket Head -->
    <ellipse cx="210" cy="190" rx="90" ry="110" />
    <!-- Racket strings grid -->
    <path d="M170 100 L170 280 M210 85 L210 295 M250 100 L250 280" stroke-width="12" stroke-opacity="0.6" />
    <path d="M135 150 L285 150 M125 190 L295 190 M135 230 L285 230" stroke-width="12" stroke-opacity="0.6" />
    <!-- Shaft & Handle -->
    <path d="M210 300 L210 390 M210 390 L210 440" stroke-width="32" stroke="#ffffff" />
    <rect x="195" y="380" width="30" height="60" rx="8" fill="#ffffff" />
    <!-- Shuttlecock -->
    <ellipse cx="360" cy="310" rx="30" ry="24" fill="#ffffff" stroke="none" />
    <path d="M340 305 L380 210 L415 225 L375 315 Z" fill="#ffffff" fill-opacity="0.8" stroke="none" />
    <path d="M350 260 L400 280" stroke="#ffffff" stroke-width="8" />
  </g>
</svg>
